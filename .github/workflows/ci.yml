name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js test/fixtures/*.mjs; do node --check "$file"; done
      - name: unit tests
        run: npm test
